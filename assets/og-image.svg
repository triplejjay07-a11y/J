  <title id="title">Peace &amp; Recovery Co.</title>
  <desc id="desc">Calm abstract shapes with the Peace &amp; Recovery Co. name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b0c10"/>
      <stop offset="1" stop-color="#1a2230"/>
    </linearGradient>
    <radialGradient id="glowA" cx="30%" cy="30%" r="55%">
      <stop offset="0" stop-color="#d9c7ff" stop-opacity=".7"/>
